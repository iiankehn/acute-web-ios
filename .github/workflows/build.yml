name: Build

on:
  push:
    branches: [main]
    # A version tag such as v0.5.0 also publishes a GitHub release after every job passes.
    tags: ['v*']
  pull_request:
  # Running the workflow on main by hand publishes the release for MARKETING_VERSION and creates its tag.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  simulator:
    # iPhone Duo needs the Xcode 27.1 SDK, available on the Xcode 27 preview image.
    runs-on: xcode-27
    # A cold iOS runtime can spend ~10 minutes installing/starting the test host
    # before the suite runs. iPhone and iPad use the image's iOS 27.0 runtime because the
    # iOS 27.1 simulator runtime supports only iPhone Duo. Keep assertion timeouts unchanged and allow the
    # full unit + UI suites (including accessibility audits) and artifact upload to finish on a slow runner.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 27.1
        run: scripts/select_xcode.sh 27.1
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Test release validation checks
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Select and boot iPhone
        id: simulator
        run: |
          DEVICE_ID=$(python3 scripts/select_simulator.py iphone --minimum 27.0)
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
      - name: Build app and test targets
        id: build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project AcuteWeb.xcodeproj \
            -scheme AcuteWeb \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -destination-timeout 120 \
            -derivedDataPath "$PWD/DerivedData" \
            -parallel-testing-enabled NO
      # Test steps skip simulator diagnostics collection, which spent 10 minutes timing out after failures;
      # the result bundles still keep failures, logs and screen recordings.
      # The unit tests run twice and must pass both times. The simulator restarts between passes: WebKit
      # processes the first pass could not terminate otherwise stalled website and download tests in the second.
      - name: Run unit tests
        run: |
          set -o pipefail
          DEVICE_ID='${{ steps.simulator.outputs.id }}'
          : > UnitTests.log
          for PASS in 1 2; do
            if [ "$PASS" = 2 ]; then
              xcrun simctl shutdown "$DEVICE_ID"
              xcrun simctl boot "$DEVICE_ID"
              xcrun simctl bootstatus "$DEVICE_ID" -b
            fi
            xcodebuild test-without-building \
              -project AcuteWeb.xcodeproj \
              -scheme AcuteWeb \
              -destination "platform=iOS Simulator,id=$DEVICE_ID" \
              -derivedDataPath "$PWD/DerivedData" \
              -resultBundlePath "TestResults-$PASS.xcresult" \
              -parallel-testing-enabled NO \
              -collect-test-diagnostics never \
              -only-testing:AcuteWebTests | tee -a UnitTests.log
          done
      - name: Run browser interface tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project AcuteWeb.xcodeproj \
            -scheme AcuteWeb \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath "$PWD/DerivedData" \
            -resultBundlePath InterfaceResults.xcresult \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics never \
            -only-testing:AcuteWebUITests | tee InterfaceTests.log
      - name: Validate bundled privacy manifest
        run: |
          APP_PATH="$PWD/DerivedData/Build/Products/Debug-iphonesimulator/AcuteWeb.app"
          test -f "$APP_PATH/PrivacyInfo.xcprivacy"
          plutil -lint "$APP_PATH/PrivacyInfo.xcprivacy"
          python3 scripts/validate_release.py "$APP_PATH" --command-log UnitTests.log --command-log InterfaceTests.log
      - name: Install and launch app on iPhone
        run: |
          APP_PATH="$PWD/DerivedData/Build/Products/Debug-iphonesimulator/AcuteWeb.app"
          xcrun simctl install '${{ steps.simulator.outputs.id }}' "$APP_PATH"
          xcrun simctl launch --terminate-running-process '${{ steps.simulator.outputs.id }}' com.acuteweb.browser.ios
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acute-web-test-results
          path: |
            TestResults-1.xcresult
            TestResults-2.xcresult
            InterfaceResults.xcresult
            UnitTests.log
            InterfaceTests.log
          if-no-files-found: ignore

  ipad-smoke:
    # iPhone Duo needs the Xcode 27.1 SDK, available on the Xcode 27 preview image.
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 27.1
        run: scripts/select_xcode.sh 27.1
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Select and boot iPad
        id: ipad
        run: |
          IPAD_ID=$(python3 scripts/select_simulator.py ipad --minimum 27.0)
          echo "id=$IPAD_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$IPAD_ID" || true
          xcrun simctl bootstatus "$IPAD_ID" -b
      - name: Build app and test targets
        id: build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project AcuteWeb.xcodeproj \
            -scheme AcuteWeb \
            -destination 'platform=iOS Simulator,id=${{ steps.ipad.outputs.id }}' \
            -destination-timeout 120 \
            -derivedDataPath "$PWD/iPadDerivedData" \
            -parallel-testing-enabled NO
      - name: Run iPad layout interface tests
        env:
          TEST_RUNNER_ACUTE_LAYOUT_TESTS: "1"
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project AcuteWeb.xcodeproj \
            -scheme AcuteWeb \
            -destination 'platform=iOS Simulator,id=${{ steps.ipad.outputs.id }}' \
            -derivedDataPath "$PWD/iPadDerivedData" \
            -resultBundlePath iPadInterfaceResults.xcresult \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics never \
            -only-testing:AcuteWebUITests/AcuteWebLayoutUITests | tee iPadInterfaceTests.log
      - name: Install and launch app on iPad
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          APP_PATH="$PWD/iPadDerivedData/Build/Products/Debug-iphonesimulator/AcuteWeb.app"
          xcrun simctl install '${{ steps.ipad.outputs.id }}' "$APP_PATH"
          xcrun simctl launch --terminate-running-process '${{ steps.ipad.outputs.id }}' com.acuteweb.browser.ios
      - name: Validate keyboard and SwiftUI logs
        run: python3 scripts/validate_release.py "$PWD/iPadDerivedData/Build/Products/Debug-iphonesimulator/AcuteWeb.app" --command-log iPadInterfaceTests.log
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acute-web-ipad-results
          path: |
            iPadInterfaceResults.xcresult
            iPadInterfaceTests.log
          if-no-files-found: ignore

  iphone-duo:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 27.1 and its iOS simulator runtime
        run: scripts/select_xcode.sh 27.1 --ios-runtime
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      # The iOS 27.1 simulator runtime is the iPhone Duo release; the job downloads it when missing.
      - name: Select and boot iPhone Duo
        id: duo
        run: |
          DUO_ID=$(python3 scripts/select_simulator.py duo --minimum 27.1)
          echo "id=$DUO_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DUO_ID" || true
          xcrun simctl bootstatus "$DUO_ID" -b
      - name: Build app and test targets
        id: build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project AcuteWeb.xcodeproj \
            -scheme AcuteWeb \
            -destination 'platform=iOS Simulator,id=${{ steps.duo.outputs.id }}' \
            -destination-timeout 120 \
            -derivedDataPath "$PWD/DuoDerivedData" \
            -parallel-testing-enabled NO
      - name: Run unit tests on iPhone Duo
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project AcuteWeb.xcodeproj \
            -scheme AcuteWeb \
            -destination 'platform=iOS Simulator,id=${{ steps.duo.outputs.id }}' \
            -derivedDataPath "$PWD/DuoDerivedData" \
            -resultBundlePath DuoUnitResults.xcresult \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics never \
            -only-testing:AcuteWebTests | tee DuoUnitTests.log
      - name: Run iPhone Duo interface tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          TEST_RUNNER_ACUTE_LAYOUT_TESTS: "1"
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project AcuteWeb.xcodeproj \
            -scheme AcuteWeb \
            -destination 'platform=iOS Simulator,id=${{ steps.duo.outputs.id }}' \
            -derivedDataPath "$PWD/DuoDerivedData" \
            -resultBundlePath DuoInterfaceResults.xcresult \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics never \
            -only-testing:AcuteWebUITests/AcuteWebLayoutUITests | tee DuoInterfaceTests.log
      - name: Validate keyboard and SwiftUI logs
        run: python3 scripts/validate_release.py "$PWD/DuoDerivedData/Build/Products/Debug-iphonesimulator/AcuteWeb.app" --command-log DuoUnitTests.log --command-log DuoInterfaceTests.log
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acute-web-iphone-duo-results
          path: |
            DuoUnitResults.xcresult
            DuoInterfaceResults.xcresult
            DuoUnitTests.log
            DuoInterfaceTests.log
          if-no-files-found: ignore

  device-ipa:
    needs: [simulator, ipad-smoke, iphone-duo]
    # iPhone Duo needs the Xcode 27.1 SDK, available on the Xcode 27 preview image.
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 27.1
        run: scripts/select_xcode.sh 27.1
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned device app
        run: |
          set -euo pipefail
          xcodebuild build \
            -project AcuteWeb.xcodeproj \
            -scheme AcuteWeb \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/DeviceDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION='${{ github.run_number }}'
      - name: Package and validate device IPA
        env:
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          APP_PATH="$PWD/DeviceDerivedData/Build/Products/Release-iphoneos/AcuteWeb.app"
          test -f "$APP_PATH/PrivacyInfo.xcprivacy"
          plutil -lint "$APP_PATH/PrivacyInfo.xcprivacy"
          python3 scripts/validate_release.py "$APP_PATH" --release
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")
          ARCHITECTURES=$(xcrun lipo -archs "$APP_PATH/$EXECUTABLE")
          [[ " $ARCHITECTURES " == *" arm64 "* ]]
          mkdir -p DeviceArtifacts/Payload
          ditto "$APP_PATH" DeviceArtifacts/Payload/AcuteWeb.app
          cd DeviceArtifacts
          /usr/bin/zip -qry AcuteWeb-unsigned.ipa Payload
          unzip -t AcuteWeb-unsigned.ipa
          shasum -a 256 AcuteWeb-unsigned.ipa > SHA256SUMS.txt
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          Path("build.json").write_text(json.dumps({
              "commit": os.environ["BUILD_COMMIT"],
              "build": os.environ["BUILD_NUMBER"],
              "platform": "iOS device (arm64)",
              "signed": False,
              "installation": "Sideloading only: sign this IPA with your Apple Account using Xcode or a sideloading tool. See RELEASE-NOTES.md."
          }, indent=2) + "\n")
          PYTHON
          cp ../RELEASE-NOTES.md .
          rm -rf Payload
      - name: Upload unsigned device IPA
        uses: actions/upload-artifact@v7
        with:
          name: acute-web-unsigned-ipa
          path: DeviceArtifacts/*
          if-no-files-found: error
          retention-days: 14

  release:
    # Runs for version tags, or a manual run on main, after the IPA job (and so every test job) has passed.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: device-ipa
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Choose the release tag
        id: tag
        run: |
          version=$(sed -n 's/^ *MARKETING_VERSION: *//p' project.yml)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "name=v$version" >> "$GITHUB_OUTPUT"
            echo "source=--target $GITHUB_SHA" >> "$GITHUB_OUTPUT"
          elif [ "v$version" = "$GITHUB_REF_NAME" ]; then
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "source=--verify-tag" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Tag $GITHUB_REF_NAME does not match MARKETING_VERSION $version in project.yml."
            exit 1
          fi
      - uses: actions/download-artifact@v7
        with:
          name: acute-web-unsigned-ipa
          path: release
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
          TAG_SOURCE: ${{ steps.tag.outputs.source }}
        run: |
          # TAG_SOURCE is --verify-tag for a pushed tag, or --target <commit> to create the tag on a manual run.
          gh release create "$TAG" \
            release/AcuteWeb-unsigned.ipa release/SHA256SUMS.txt release/build.json \
            --title "Acute Web ${TAG#v} beta" \
            --notes-file RELEASE-NOTES.md \
            --prerelease \
            $TAG_SOURCE
