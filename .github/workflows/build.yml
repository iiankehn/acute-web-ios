name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Test release validation checks
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Select and boot iPhone
        id: simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[d for runtime, values in data["devices"].items() if "iOS-26-2" in runtime for d in values if d.get("isAvailable") and d["name"] == "iPhone 17 Pro"]; print(devices[0]["udid"])')
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
      - name: Build app and test targets
        id: build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project AcuteWeb.xcodeproj \
            -scheme AcuteWeb \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -destination-timeout 120 \
            -derivedDataPath "$PWD/DerivedData" \
            -parallel-testing-enabled NO
      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project AcuteWeb.xcodeproj \
            -scheme AcuteWeb \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath "$PWD/DerivedData" \
            -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -test-repetition-relaunch-enabled YES \
            -only-testing:AcuteWebTests
      - name: Run browser interface tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project AcuteWeb.xcodeproj \
            -scheme AcuteWeb \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath "$PWD/DerivedData" \
            -resultBundlePath InterfaceResults.xcresult \
            -parallel-testing-enabled NO \
            -only-testing:AcuteWebUITests
      - name: Validate bundled privacy manifest
        run: |
          APP_PATH="$PWD/DerivedData/Build/Products/Debug-iphonesimulator/AcuteWeb.app"
          test -f "$APP_PATH/PrivacyInfo.xcprivacy"
          plutil -lint "$APP_PATH/PrivacyInfo.xcprivacy"
          python3 scripts/validate_release.py "$APP_PATH"
      - name: Install and launch app on iPhone
        run: |
          APP_PATH="$PWD/DerivedData/Build/Products/Debug-iphonesimulator/AcuteWeb.app"
          xcrun simctl install '${{ steps.simulator.outputs.id }}' "$APP_PATH"
          xcrun simctl launch --terminate-running-process '${{ steps.simulator.outputs.id }}' com.acuteweb.browser.ios
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acute-web-test-results
          path: |
            TestResults.xcresult
            InterfaceResults.xcresult
          if-no-files-found: ignore

  ipad-smoke:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Select and boot iPad
        id: ipad
        run: |
          IPAD_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[d for runtime, values in data["devices"].items() if "iOS-26-2" in runtime for d in values if d.get("isAvailable") and d["name"].startswith("iPad Pro")]; print(devices[0]["udid"])')
          echo "id=$IPAD_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$IPAD_ID" || true
          xcrun simctl bootstatus "$IPAD_ID" -b
      - name: Build, install, and launch app on iPad
        run: |
          xcodebuild build \
            -project AcuteWeb.xcodeproj \
            -scheme AcuteWeb \
            -destination 'platform=iOS Simulator,id=${{ steps.ipad.outputs.id }}' \
            -destination-timeout 120 \
            -derivedDataPath "$PWD/iPadDerivedData"
          APP_PATH="$PWD/iPadDerivedData/Build/Products/Debug-iphonesimulator/AcuteWeb.app"
          xcrun simctl install '${{ steps.ipad.outputs.id }}' "$APP_PATH"
          xcrun simctl launch --terminate-running-process '${{ steps.ipad.outputs.id }}' com.acuteweb.browser.ios

  device-ipa:
    needs: [simulator, ipad-smoke]
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned device app
        run: |
          set -euo pipefail
          xcodebuild build \
            -project AcuteWeb.xcodeproj \
            -scheme AcuteWeb \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/DeviceDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION='${{ github.run_number }}'
      - name: Package and validate device IPA
        env:
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          APP_PATH="$PWD/DeviceDerivedData/Build/Products/Release-iphoneos/AcuteWeb.app"
          test -f "$APP_PATH/PrivacyInfo.xcprivacy"
          plutil -lint "$APP_PATH/PrivacyInfo.xcprivacy"
          python3 scripts/validate_release.py "$APP_PATH" --release
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")
          ARCHITECTURES=$(xcrun lipo -archs "$APP_PATH/$EXECUTABLE")
          [[ " $ARCHITECTURES " == *" arm64 "* ]]
          mkdir -p DeviceArtifacts/Payload
          ditto "$APP_PATH" DeviceArtifacts/Payload/AcuteWeb.app
          cd DeviceArtifacts
          /usr/bin/zip -qry AcuteWeb-unsigned.ipa Payload
          unzip -t AcuteWeb-unsigned.ipa
          shasum -a 256 AcuteWeb-unsigned.ipa > SHA256SUMS.txt
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          Path("build.json").write_text(json.dumps({
              "commit": os.environ["BUILD_COMMIT"],
              "build": os.environ["BUILD_NUMBER"],
              "platform": "iOS device (arm64)",
              "signed": False,
              "installation": "Sign this IPA with your chosen sideloading tool before installing."
          }, indent=2) + "\n")
          PYTHON
          rm -rf Payload
      - name: Upload unsigned device IPA
        uses: actions/upload-artifact@v4
        with:
          name: acute-web-unsigned-ipa
          path: DeviceArtifacts/*
          if-no-files-found: error
          retention-days: 14
