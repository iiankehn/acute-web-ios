name: AcuteWeb
options:
  bundleIdPrefix: com.acuteweb
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  AcuteWeb:
    type: application
    platform: iOS
    sources: [AcuteWeb]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.acuteweb.browser.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Acute Web
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Acute Web requests camera access only when a website asks and you approve it.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Acute Web requests microphone access only when a website asks and you approve it.
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
    scheme:
      testTargets: [AcuteWebTests, AcuteWebUITests]
  AcuteWebTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AcuteWebTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AcuteWeb
  AcuteWebUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AcuteWebUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AcuteWeb
