name: AcuteWeb
options:
  bundleIdPrefix: com.acuteweb
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  AcuteWeb:
    type: application
    platform: iOS
    sources: [AcuteWeb]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.acuteweb.browser.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Acute Web
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
    scheme:
      testTargets: [AcuteWebTests]
  AcuteWebTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AcuteWebTests]
    dependencies:
      - target: AcuteWeb

